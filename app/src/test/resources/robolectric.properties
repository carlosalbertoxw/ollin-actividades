# SDK 34: Robolectric todavia no trae imagen del 36 al que apunta la app, y la
# base de datos no cambia de comportamiento entre esas versiones.
sdk=34

# SQLite nativo y no el emulado: el emulado sirve una sola conexion por hilo, y
# Room reparte sus consultas entre varios hilos de disco. Con LEGACY, cualquier
# prueba que lea desde un Flow revienta con "Illegal connection pointer".
sqliteMode=NATIVE
