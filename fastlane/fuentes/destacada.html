<!doctype html>
<!--
  Imagen destacada de la ficha de Play, 1024x500. Play la recorta y le pone
  encima el boton de reproducir si hay video, asi que lo importante va en el
  centro y lejos de las orillas. Colores del sitio (web/src/estilo.css).
  Se regenera con genera.sh.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=block">
<style>
  :root {
    --obsidiana: #12181b;
    --obsidiana-clara: #242e33;
    --jade: #2f9e6e;
    --jade-claro: #6fcfa1;
    --cempasuchil: #e9a13b;
    --papel: #f7f5f0;
    --tenue: #9aa5a1;
  }
  html, body { margin: 0; }
  body {
    width: 1024px;
    height: 500px;
    overflow: hidden;
    background:
      radial-gradient(circle at 30% 50%, rgba(233, 161, 59, 0.10), transparent 42%),
      var(--obsidiana);
    font-family: Roboto, 'Segoe UI', sans-serif;
    color: var(--papel);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 56px;
  }
  svg { width: 260px; height: 260px; flex: none; }
  h1 { margin: 0; font-size: 66px; font-weight: 700; letter-spacing: -1px; line-height: 1; }
  h1 span { color: var(--cempasuchil); }
  p { margin: 18px 0 0; font-size: 32px; color: var(--tenue); }
  ul {
    display: flex;
    gap: 10px;
    margin: 30px 0 0;
    padding: 0;
    list-style: none;
  }
  li {
    font-size: 19px;
    font-weight: 500;
    color: var(--jade-claro);
    border: 1.5px solid rgba(111, 207, 161, 0.35);
    border-radius: 999px;
    padding: 7px 16px;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="26 26 56 56" aria-hidden="true">
  <path fill="none" stroke="#E9A13B" stroke-width="6" stroke-linecap="round"
        d="M54,32 A22,22 0 1 1 34.7,43.5" />
  <path fill="none" stroke="#2F9E6E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
        d="M54,42 L54,54 L63,59" />
</svg>
<div>
  <h1>Ollin <span>Actividades</span></h1>
  <p>Tu tiempo, anotado.</p>
  <ul>
    <li>Sin cuentas</li>
    <li>Sin nube</li>
    <li>Sin publicidad</li>
  </ul>
</div>
</body>
</html>
