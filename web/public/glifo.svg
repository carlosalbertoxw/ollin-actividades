<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108" role="img" aria-label="Glifo de Ollin">
  <title>Ollin</title>
  <!--
    El mismo glifo que la app (res/drawable/ic_ollin_glyph.xml): un reloj
    abierto. El circulo no cierra porque el registro siempre esta en curso, y
    la manecilla apunta al jade, que es el color del tiempo ya cumplido.
  -->
  <path fill="none" stroke="#E9A13B" stroke-width="6" stroke-linecap="round"
        d="M54,32 A22,22 0 1 1 34.7,43.5" />
  <path fill="none" stroke="#2F9E6E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
        d="M54,42 L54,54 L63,59" />
</svg>
